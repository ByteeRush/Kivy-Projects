name: Build Kivy APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential libstdc++6

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install --user Cython==0.29.36 buildozer

    - name: Add local bin to PATH
      run: echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Build with Buildozer
      run: |
        cd Calculator
        # GitHub Actions'ın varsayılan çakışan NDK yollarını tamamen temizle
        unset ANDROID_NDK
        unset ANDROID_NDK_HOME
        
        # Buildozer'ın kendi beklediği NDK ve SDK ortam yollarını sabitle
        export ANDROID_HOME="/home/runner/.buildozer/android/platform/android-sdk"
        export ANDROIDNDK="/home/runner/.buildozer/android/platform/android-ndk-r25b"
        export ANDROIDAPI="33"
        export ANDROIDMINAPI="24"

        # SDK lisanslarını otomatik onaylayarak derlemeyi başlatıyoruz
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: Calculator/bin/*.apk
